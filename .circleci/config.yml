# Clojure CircleCI 2.0 configuration file
# Check https://circleci.com/docs/2.0/language-clojure/ for more details
version: 2
jobs:
  build:
    docker:
      - image: cimg/clojure:1.12.5-openjdk-21.0-node
      - image: debezium/postgres:16
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
      - image: google/cloud-sdk:latest
        command: [gcloud, beta, emulators, pubsub, start, '--host-port=localhost:8085']
    working_directory: ~/repo
    environment:
      JVM_OPTS: -Xmx3200m
    steps:
      - checkout
      - run:
          name: Install Babashka
          command: |
            curl --fail --location --silent --show-error https://github.com/babashka/babashka/releases/download/v1.12.218/babashka-1.12.218-linux-amd64-static.tar.gz | tar -xz -C /tmp
            sudo install -m 0755 /tmp/bb /usr/local/bin/bb
      # Download and cache dependencies
      - restore_cache:
          keys:
          - v2-dependencies-{{ checksum "deps.edn" }}
          # fallback to using the latest cache if no exact match is found
          - v2-dependencies-
      - run: bb deps
      - save_cache:
          paths:
            - ~/.m2
          key: v2-dependencies-{{ checksum "deps.edn" }}
      - run:
          name: Wait for pubsub emulator
          command: dockerize -wait tcp://localhost:8085 -timeout 1m
      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run: bb setup
      - run: bb check
